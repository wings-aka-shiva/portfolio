<!doctype html>
<!--
  Open Graph image template (1200x630). Regenerate public/og-image.png with a
  headless Chromium screenshot, e.g.:
    chrome --headless --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=5000 --screenshot=public/og-image.png scripts/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;900&display=block" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #09090f;
        font-family: "Montserrat", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        box-sizing: border-box;
        position: relative;
      }
      .glow {
        position: absolute; top: -160px; left: -160px;
        width: 620px; height: 620px; border-radius: 50%;
        background: rgba(79, 70, 229, 0.16); filter: blur(120px);
      }
      .line { width: 96px; height: 4px; background: #4f46e5; border-radius: 2px; margin-bottom: 40px; position: relative; }
      h1 { margin: 0; color: #f1f1f3; font-size: 88px; font-weight: 900; line-height: 1.02; letter-spacing: -0.02em; position: relative; }
      p { margin: 28px 0 0; color: #6b7280; font-size: 34px; font-weight: 500; position: relative; }
      .url { position: absolute; bottom: 56px; left: 96px; margin: 0; font-size: 22px; color: #3f3f5a; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="line"></div>
    <h1>Shiva Kumar<br />Tirupathi</h1>
    <p>Software Engineer · Melbourne</p>
    <p class="url">wings-aka-shiva.github.io/portfolio</p>
  </body>
</html>
